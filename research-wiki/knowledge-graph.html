    "sections": {
      "One-line thesis": "<p>A pure Transformer architecture applied directly to sequences of image patches can achieve state-of-the-art image classification when pre-trained at sufficient scale, outperforming convolutional networks with lower pre-training cost.</p>\n<p>ViT挑战了CNN的“归纳偏置”。简单来说，归纳偏置就是模型为了让学习问题变得可行，而提前内置在算法中的“先验知识”或“默认假设”。CNN的先验知识就是假设图像具有局部性和平移等变性</p>",
      "Assumptions": "<ol>\n<li>Sufficient pre-training data is available (at least 14M images) — the model does not generalize well on small data</li>\n<li>Patch size and position embedding interpolation are sufficient spatial inductive bias; the model assumes 2D structure can be learned from data</li>\n<li>Standard Transformer architecture transfers directly from NLP to vision with minimal modification</li>\n</ol>\n<p>之前的视觉问题无论如何解决不了对CNN的依赖，研究证明对CNN的依赖不是必要的（直接使用序列方法）。在大量数据上进行预训练并迁移到多个中型或小型图像识别基准时表现很好。<br>在小的数据集上表现要略低于ResNets，作者的观点是因为这缺乏了某些先验假设<br>这也是为什么ViT在小尺寸表现不好（作者认为小尺寸更关注局部信息，这对全局处理的架构没有很大帮助）但是扩展到大尺寸的图片表现优于传统CNN</p>",

i>\n<li>Flatten to: An sequence of $n \\times p^2 \\times C$(分别是序列长度 , patch大小 , 通道数)</li>\n<li>Projection to: $Z_0 = [{x_p}^1E ;\\dots {x_p}^nE] + E_{pos}$</li>\n</ul>\n<p>此外，序列的第一个位置设置为一个可学习的token，用于预测class。位置编码的实验表明1d的位置编码表现比2d好。一个有意思的点是，当分辨率提高时，原来的位置编码失效，作者采用插值的方法将新的位置得到编码<br>对于zero shot下游任务，将最后的projection头替换掉，改用$D \\times K$ 的头进行微调<br>ViT splits an image into fixed-size patches (e.g., 16x16), linearly embeds each patch, adds position embeddings, and feeds the resulting sequence to a standard Transformer encoder. A learnable [CLS] token appended to the sequence serves as the image representation for classification. The model uses standard Transformer blocks (multi-head self-attention, MLP, LayerNorm, residual connections). ViT intentionally minimizes vision-specific modifications — the key inductive biases are only at patch extraction and position embedding interpolation during fine-tuning. A hybrid variant uses CNN feature maps as input patches instead of raw pixels.</p>",
      "Key Results": "<ul>\n<li>Pre-trained on ImageNet-21k (14M images) or JFT-300M (303M images), ViT matches or beats state-of-the-art CNNs on multiple benchmarks。在去重后的下游数据集进行测试。</li>\n<li>Best model: 88.55% on ImageNet, 90.72% on ImageNet-ReaL, 94.55% on CIFAR-100, 77.63% on VTAB (19 tasks)</li>\n<li>ViT requires substantially less computational resources to pre-train than comparable CNNs</li>\n<li>Performance scales with dataset size — on mid-sized datasets (ImageNet-1k) ViT underperforms ResNets of comparable size without strong regularization, but on large datasets the gap reverses 一个有意思的关注是CNN在scale up的表现上不如Transformer架构，而ViT-Huge在所有任务上的表现最好，证明了Transformer架构scale up在图片理解上也能成功。而4.3的实验也证明了这一点。（似乎大尺寸的模型甚至在小尺寸直接找不到了）</li>\n</ul>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOIAAAG0CAIAAAAQCx9cAAAACXBIWXMAAAsTAAALEwEAmpwYAAAgAElEQVR4nOzdeXSb530v+AcrAZAAuICiJC6ydspS5CVyLNmKCdhtppXrScdLnNMk6tw7bXp6zj1ycjW505zcFsRt/5k5VdPcuSc5uTO990ybmcZ14iaNo6aJHQLxItPxqqQSRYuyxEUSxZcCieUFQCzv/PGTX796Abx8ie1d8P0cH5+H4As8D0AIL77vs1kEQWAAAAAAAAAA+mDVugEAAAAAAAAAH0FMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdsWvdAD2KRqORSIQxFgwGw+Fw+W9jsRiVy38LAAAAAAAA9UBMlaOAOjExQeVQKBQOh4PBoPS3lE5DoRCSKgAAAAAAQGNZBEHQug06EolExsfHpa8JZVExtcp+a7FYJiYmxBALAAAAAAAAdcLc1PVFo9FoNMoYGx8fl/0qGAxS/yoAAAAAAAA0BGLqbSiOSsl6Sss7TsUQCwAAAAAAAPVDTK2gYuykG9dNrYyxfD7fzNYBAAAAAACYGZZQuk0wGKRlfuuZbvqjH/3oj/7oj6hcKpXi8XhPT4/V2pQrAqVSqUmPDG2rVCoxxvC+gsZq6ofV8vLya6+9dvjw4SY9       "Limitations / Failure Modes": "<ul>\n<li>Requires large-scale pre-training data to outperform CNNs; on small data it underperforms due to lack of built-in inductive biases</li>\n<li>Quadratic self-attention cost in sequence length limits high-resolution image processing</li>\n<li>Position embedding interpolation at higher resolutions during fine-tuning is a heuristic</li>\n<li>Less parameter-efficient than CNNs for small to medium data regimes</li>\n<li>No built-in translation equivariance — the model must learn spatial relationships from scratch</li>\n</ul>",
      "Reusable Ingredients": "<ul>\n<li>Patch-based image tokenization (16x16 patches as visual \"words\")</li>\n<li>Pre-trained [CLS] token representation for transfer learning</li>\n<li>Hybrid CNN+Transformer design for leveraging feature maps</li>\n<li>2D interpolation of position embeddings for variable-resolution fine-tuning</li>\n<li>Scalable proof that large-scale training trumps inductive bias</li>\n<li>对每个部分的拆分分析，包括为什么1d位置编码效果好，可视化验证表明在学习中，patch映射的embedding已经学习到了2d的空间特征。实验还发现有些注意力头在开始就已经关注到远处的信息。而作者也关注到这种长距离关注在ResNet中不是很明显，作者的推断是注意力机制代替了CNN的某些inductive bias</li>\n</ul>",
      "Open Questions": "<ul>\n<li>Can ViT benefit from more vision-specific inductive biases without losing scalability?</li>\n<li>How does ViT compare on dense prediction tasks (detection, segmentation) without architectural modifications?</li>\n<li>What is the optimal patch size trade-off between performance and computational cost?</li>\n</ul>",
      "Claims": "<p>Attention机制在某些程度上可以起到和原来的CNN一样的感受能力，从而替代CNN的同时获得了更好的scale up能力</p>",
      "Relevance to This Project": "<p>Foundational architecture for modern vision-language models — both CLIP and BLIP-2 use ViT as a backbone image encoder. Understanding ViT is essential for any VLM research.</p>"

    "thesis": "Swin Transformer introduces a hierarchical Transformer architecture with shifted window self-attention that achieves linear computational complexity with respect to image size, enabling it to serve as a general-purpose backbone for both image classification and dense prediction tasks (detection, segmentation).",
    "sections": {
      "One-line thesis": "<p>Swin Transformer introduces a hierarchical Transformer architecture with shifted window self-attention that achieves linear computational complexity with respect to image size, enabling it to serve as a general-purpose backbone for both image classification and dense prediction tasks (detection, segmentation).</p>",
      "Problem / Gap": "<p>Previous vision Transformers (ViT) produce single-resolution feature maps and have quadratic self-attention complexity with respect to image size. This makes them unsuitable for dense prediction tasks like object detection and semantic segmentation, where multi-scale features are essential and high-resolution inputs exacerbate the quadratic cost. ViT also struggles to capture visual elements at varying scales. The challenge was to design a Transformer backbone that can serve as a general-purpose vision backbone like CNNs (ResNet) do, compatible with existing dense prediction frameworks such as FPN and U-Net.</p>",
      "Method": "<p>Swin Transformer introduces several key innovations over ViT:</p>\n<ol>\n<li><strong>Hierarchical feature maps</strong>: Starting from small 4×4 patches, neighboring patches are gradually merged in deeper layers (via patch merging layers), producing feature maps at 4×, 8×, 16×, and 32× downsampling ratios — analogous to the multi-scale feature pyramid in CNNs like ResNet.</li>\n</ol>\n<ol>\n<li><strong>Shifted window attention (Swin)</strong>: Self-attention is computed within non-overlapping local windows (default 7×7 patches). Between consecutive Transformer blocks, the window partition is shifted ((⌊M/2⌋, ⌊M/2⌋) pixels), enabling cross-window connections. This yields O(M²hwC) complexity — <strong>linear</strong> in image size hw — versus O((hw)²C) for global self-attention.</li>\n</ol>\n<ol>\n<li><strong>Efficient batch computation</strong>: A cyclic-shifting technique ensures that the number of batched windows remains the same between regular and shifted configurations, avoiding the 2.25× computation blow-up of naive padding.</li>\n</ol>\n<ol>\n<li><strong>Relative position bias</strong>: The model uses learnable relative position biases B̂ ∈ R^(2M−1)×(2M−1) per attention head, which improve accuracy over absolute position embeddings.</li>\n</ol>\n<p>Architecture variants: Swin-T (tiny), Swin-S (small), Swin-B (base), Swin-L (large), with channel sizes C = 96/96/128/192 and layer counts {2,2,6,2} / {2,2,18,2} / {2,2,18,2} / {2,2,18,2}.</p>",
      "Key Results": "<ul>\n<li><strong>Image classification</strong>: Swin-B achieves 84.5% top-1 on ImageNet-1K (384² input, regular training). With ImageNet-22K pre-training: Swin-L achieves 87.3% top-1, surpassing ViT-L's 85.2% with 2.6× higher throughput.</li>\n</ul>\n<ul>\n<li><strong>Object detection (COCO)</strong>: Swin-L (HTC++) achieves 58.7 box AP and 51.1 mask AP on COCO test-dev, surpassing previous SOTA by +2.7 box AP and +2.6 mask AP. Under standard Cascade Mask R-CNN, Swin-T surpasses ResNet-50 by +3.4~4.2 box AP consistently across four different detection frameworks.</li>\n</ul>\n<ul>\n<li><strong>Semantic segmentation (ADE20K)</strong>: Swin-L (UperNet) achieves 53.5 mIoU, outperforming previous SOTA (SETR) by +3.2 mIoU.</li>\n</ul>\n<ul>\n<li><strong>Linear complexity</strong>: The window-based self-attention has linear computational complexity to image size, making high-resolution dense prediction tractable.</li>\n</ul>",
      "Assumptions": "<ul>\n<li>Hierarchical feature maps (multi-scale) are essential for general-purpose vision backbones.</li>\n<li>Local window self-attention combined with cross-window connections is sufficient for modeling visual relationships.</li>\n<li>The 7×7 window size balances efficiency and modeling power; relative position bias handles positional information effectively.</li>\n<li>The patch merging strategy (2×2 → 4× downsampling per stage) provides a useful inductive bias.</li>\n</ul>",

      "Method": "<p>CLIP (Contrastive Language-Image Pre-training) trains an image encoder and a text encoder jointly to predict correct pairings in a batch of (image, text) examples. The contrastive objective maximizes cosine similarity between matched image-text pairs while minimizing it for mismatched pairs. Both encoders can be various architectures (ViT or ResNet for images; Transformer for text). After pre-training, natural language is used to reference visual concepts, enabling zero-shot transfer — the text encoder synthesizes a classifier by embedding class names/descriptions, and prediction is done by selecting the highest similarity score. Training uses a dataset of 400M (image, text) pairs called WIT (WebImageText).</p>",

function searchPapers(query){
  var q=query.toLowerCase().trim();
  var cards=document.getElementById('sidePanel').children;
  var count=PAPERS.length;
  var matches={};
  if(q){
    count=0;
    PAPERS.forEach(function(p,i){
      var haystack=[p.title,p.short,p.authors.join(' '),p.tags.join(' '),p.thesis,p.venue,String(p.year||''),p.slug];
      var match=haystack.join(' ').toLowerCase().indexOf(q)!==-1;
      matches[p.id]=match;
      if(match)count++;
      if(cards[i])cards[i].style.display=match?'':'none';
    });
  }else{PAPERS.forEach(function(p,i){matches[p.id]=true;if(cards[i])cards[i].style.display=''})}
  document.getElementById('searchCount').textContent=q?(count+'/'+PAPERS.length+' results'):'';
  if(window._nodeSel){
    window._nodeSel.select('circle').attr('opacity',function(d){return matches[d.id]?0.85:0.15});
    window._nodeSel.selectAll('text').attr('opacity',function(d){return matches[d.id]?1:0.15});
  }
}

  (function r(n){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([document.getElementById('detailBody')]).catch(console.error)}else if(n>0){setTimeout(function(){r(n-1)},200)}})(10);
}
function closeDetail(){document.getElementById('detailModal').classList.remove('open')}
document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeDetail()});

document.addEventListener('DOMContentLoaded',init);
</script>
