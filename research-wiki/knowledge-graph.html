    "sections": {
      "One-line thesis": "<p>A pure Transformer architecture applied directly to sequences of image patches can achieve state-of-the-art image classification when pre-trained at sufficient scale, outperforming convolutional networks with lower pre-training cost.</p>\n<p>ViT挑战了CNN的“归纳偏置”。简单来说，归纳偏置就是模型为了让学习问题变得可行，而提前内置在算法中的“先验知识”或“默认假设”。CNN的先验知识就是假设图像具有局部性和平移等变性</p>",
      "Assumptions": "<ol>\n<li>Sufficient pre-training data is available (at least 14M images) — the model does not generalize well on small data</li>\n<li>Patch size and position embedding interpolation are sufficient spatial inductive bias; the model assumes 2D structure can be learned from data</li>\n<li>Standard Transformer architecture transfers directly from NLP to vision with minimal modification</li>\n</ol>\n<p>之前的视觉问题无论如何解决不了对CNN的依赖，研究证明对CNN的依赖不是必要的（直接使用序列方法）。在大量数据上进行预训练并迁移到多个中型或小型图像识别基准时表现很好。<br>在小的数据集上表现要略低于ResNets，作者的观点是因为这缺乏了某些先验假设<br>这也是为什么ViT在小尺寸表现不好（作者认为小尺寸更关注局部信息，这对全局处理的架构没有很大帮助）但是扩展到大尺寸的图片表现优于传统CNN</p>",

i>\n<li>Flatten to: An sequence of $n \\times p^2 \\times C$(分别是序列长度 , patch大小 , 通道数)</li>\n<li>Projection to: $Z_0 = [\\mathbf{x}_p^1 \\mathbf{E}; \\dots ; \\mathbf{x}_p^N \\mathbf{E}] + \\mathbf{E}_{pos}$</li>\n</ul>\n<p>此外，序列的第一个位置设置为一个可学习的token，用于预测class。位置编码的实验表明1d的位置编码表现比2d好。一个有意思的点是，当分辨率提高时，原来的位置编码失效，作者采用插值的方法将新的位置得到编码<br>对于zero shot下游任务，将最后的projection头替换掉，改用$D \\times K$ 的头进行微调<br>ViT splits an image into fixed-size patches (e.g., 16x16), linearly embeds each patch, adds position embeddings, and feeds the resulting sequence to a standard Transformer encoder. A learnable [CLS] token appended to the sequence serves as the image representation for classification. The model uses standard Transformer blocks (multi-head self-attention, MLP, LayerNorm, residual connections). ViT intentionally minimizes vision-specific modifications — the key inductive biases are only at patch extraction and position embedding interpolation during fine-tuning. A hybrid variant uses CNN feature maps as input patches instead of raw pixels.</p>",
      "Key Results": "<ul>\n<li>Pre-trained on ImageNet-21k (14M images) or JFT-300M (303M images), ViT matches or beats state-of-the-art CNNs on multiple benchmarks。在去重后的下游数据集进行测试。</li>\n<li>Best model: 88.55% on ImageNet, 90.72% on ImageNet-ReaL, 94.55% on CIFAR-100, 77.63% on VTAB (19 tasks)</li>\n<li>ViT requires substantially less computational resources to pre-train than comparable CNNs</li>\n<li>Performance scales with dataset size — on mid-sized datasets (ImageNet-1k) ViT underperforms ResNets of comparable size without strong regularization, but on large datasets the gap reverses 一个有意思的关注是CNN在scale up的表现上不如Transformer架构，而ViT-Huge在所有任务上的表现最好，证明了Transformer架构scale up在图片理解上也能成功。而4.3的实验也证明了这一点。（似乎大尺寸的模型甚至在小数据集的准确率直接找不到了）</li>\n</ul>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOIAAAG0CAIAAAAQCx9cAAAACXBIWXMAAAsTAAALEwEAmpwYAAAgAElEQVR4nOzdeXSb530v+AcrAZAAuICiJC6ydspS5CVyLNmKCdhtppXrScdLnNMk6tw7bXp6zj1ycjW505zcFsRt/5k5VdPcuSc5uTO990ybmcZ14iaNo6aJHQLxItPxqqQSRYuyxEUSxZcCieUFQCzv/PGTX796Abx8ie1d8P0cH5+H4As8D0AIL77vs1kEQWAAAAAAAAAA+mDVugEAAAAAAAAAH0FMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdQUwFAAAAAAAAHUFMBQAAAAAAAB1BTAUAAAAAAAAdsWvdAD2KRqORSIQxFgwGw+Fw+W9jsRiVy38LAAAAAAAA9UBMlaOAOjExQeVQKBQOh4PBoPS3lE5DoRCSKgAAAAAAQGNZBEHQug06EolExsfHpa8JZVExtcp+a7FYJiYmxBALAAAAAAAAdcLc1PVFo9FoNMoYGx8fl/0qGAxS/yoAAAAAAAA0BGLqbSiOSsl6Sss7TsUQCwAAAAAAAPVDTK2gYuykG9dNrYyxfD7fzNYBAAAAAACYGZZQuk0wGKRlfuuZbvqjH/3oj/7oj6hcKpXi8XhPT4/V2pQrAqVSqUmPDG2rVCoxxvC+gsZq6ofV8vLya6+9dvj       "Limitations / Failure Modes": "<ul>\n<li>Requires large-scale pre-training data to outperform CNNs; on small data it underperforms due to lack of built-in inductive biases</li>\n<li>Quadratic self-attention cost in sequence length limits high-resolution image processing</li>\n<li>Position embedding interpolation at higher resolutions during fine-tuning is a heuristic</li>\n<li>Less parameter-efficient than CNNs for small to medium data regimes</li>\n<li>No built-in translation equivariance — the model must learn spatial relationships from scratch</li>\n</ul>",
      "Reusable Ingredients": "<ul>\n<li>Patch-based image tokenization (16x16 patches as visual \"words\")</li>\n<li>Pre-trained [CLS] token representation for transfer learning</li>\n<li>Hybrid CNN+Transformer design for leveraging feature maps</li>\n<li>2D interpolation of position embeddings for variable-resolution fine-tuning</li>\n<li>Scalable proof that large-scale training trumps inductive bias</li>\n<li>对每个部分的拆分分析，包括为什么1d位置编码效果好，可视化验证表明在学习中，patch映射的embedding已经学习到了2d的空间特征。实验还发现有些注意力头在开始就已经关注到远处的信息。而作者也关注到这种长距离关注在ResNet中不是很明显，作者的推断是注意力机制代替了CNN的某些inductive bias</li>\n</ul>",
      "Open Questions": "<ul>\n<li>Can ViT benefit from more vision-specific inductive biases without losing scalability?</li>\n<li>How does ViT compare on dense prediction tasks (detection, segmentation) without architectural modifications?</li>\n<li>What is the optimal patch size trade-off between performance and computational cost?</li>\n</ul>",
      "Claims": "<p>Attention机制在某些程度上可以起到和原来的CNN一样的感受能力，从而替代CNN的同时获得了更好的scale up能力</p>",
      "Relevance to This Project": "<p>Foundational architecture for modern vision-language models — both CLIP and BLIP-2 use ViT as a backbone image encoder. Understanding ViT is essential for any VLM research.</p>"

    "nodeColor": "#da3633",
    "thesis": "- Swin Transformer introduces a hierarchical Transformer architecture with shifted window self-attention that achieves linear computational complexity with respect to image size, enabling it to serve as a general-purpose backbone for both image classification and dense prediction tasks (detection, segmentation).\n- 使用滑动窗口，减轻了不重叠的窗口之间可能包含的信息，增强了对多窗口信息之间联系的理解。具有良好的scale up能力，并且降低计算复杂度到线性。（ViT关注的是全局注意力，Swin Transformer的先验假设是小窗口内的需要优先关注，然后再是大的）",
    "sections": {
      "One-line thesis": "<ul>\n<li>Swin Transformer introduces a hierarchical Transformer architecture with shifted window self-attention that achieves linear computational complexity with respect to image size, enabling it to serve as a general-purpose backbone for both image classification and dense prediction tasks (detection, segmentation).</li>\n<li>使用滑动窗口，减轻了不重叠的窗口之间可能包含的信息，增强了对多窗口信息之间联系的理解。具有良好的scale up能力，并且降低计算复杂度到线性。（ViT关注的是全局注意力，Swin Transformer的先验假设是小窗口内的需要优先关注，然后再是大的）</li>\n</ul>",
      "Problem / Gap": "<p>Previous vision Transformers (ViT) produce single-resolution feature maps and have quadratic self-attention complexity with respect to image size. This makes them unsuitable for dense prediction tasks like object detection and semantic segmentation, where multi-scale features are essential and high-resolution inputs exacerbate the quadratic cost. ViT also struggles to capture visual elements at varying scales. The challenge was to design a Transformer backbone that can serve as a general-purpose vision backbone like CNNs (ResNet) do, compatible with existing dense prediction frameworks such as FPN and U-Net.</p>\n<ul>\n<li>图片信息在规模和分别率上有很大不同，先前的工作使用一个统一的scale，对不同场景下的目标检测任务效果不好。这种改进是的图像适用于多样化的分辨率问题</li>\n</ul>",
      "Method": "<p>Swin Transformer introduces several key innovations over ViT:</p>\n<ul>\n<li><strong>Hierarchical feature maps</strong>: Starting from small 4×4 patches, neighboring patches are gradually merged in deeper layers (via patch merging layers), producing feature maps at 4×, 8×, 16×, and 32× downsampling ratios — analogous to the multi-scale feature pyramid in CNNs like ResNet.</li>\n</ul>\n<ul>\n<li>先小patch再逐步扩大，得到对于全局的感知。</li>\n</ul>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAByUAAAKNCAIAAAABFyB9AAAA62lDQ1BzUkdCAAAYlZWQrW4CURBGzy0g2tAgShrkCiQEW8mPwJA2bBAsFWR3+TEFNndvQl+AoGtqm6q+QeuxGJJNqngIAg26uYvYFdCGIyYn34yYGRBLgIsyjMZKmvWq0bY6BjFs1/c4jYD9t64QFJsqlflj9hiXsm11gA2QHYYuktqdg+e0T5WnQBS0u57UXgbSsmXWQDQAYxhzJ+a9vu+CeAK60W2TN7j7gcRLlDmv8DWH3DrK8u+QmcFnEGW7h/BecbtQ/Welk/tSBc+WdthO6IcOBrD9gGsLblZw9XjYIyTlm/XqmX/6j19y2DaE8+3AvgAAAAlwSFlzAAAOwwAADsMBx2+oZAAAIABJREFUeJzs3X18Y1d56Pu9JdmemUBfAoTSJNrSTG/InEl7b2npGyONXKAzHtpTTpNeKJJjGcrYUHo5/bSnMNacSoZYhva0/fT0tLFDwTKWaWkLpZd0Xk4p1kiTXiin5Z5DpgO5yXhLhIaGkpZCxrbe9v3jgZVdvY0sb1my9fv+MR+PrJdle6291372s56lW5alAQAAAAAAAAB2zNXrBgAAAAAAAADAPkG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACcQbwVAAAAAAAAAJxBvBUAAAAAAAAAnEG8FQAAAAAAAACc4el1AwAAAAAAwIDKZDLLy8uaplmWpet6B+/Qzgv37pvvfqsmJiZCoVAHLwSgEG8FAAAAAAC9kclkUqmUz+frdUOgmaYp8dZeN2QPm5ycXFpa6nUr0HvEW ><strong>Efficient batch computation</strong>: A cyclic-shifting technique ensures that the number of batched windows remains the same between regular and shifted configurations, avoiding the 2.25× computation blow-up of naive padding.</li>\n</ul>\n<ul>\n<li><strong>Relative position bias</strong>: The model uses learnable relative position biases B̂ ∈ R^(2M−1)×(2M−1) per attention head, which improve accuracy over absolute position embeddings.相对位置编码通过在窗口内的token对之间管理，有效的关注到了不同token之间的关系，实验显著优于绝对位置编码。（为啥ViT一维就好，swinT使用相对的更好？）</li>\n</ul>\n<p>Architecture variants: Swin-T (tiny), Swin-S (small), Swin-B (base), Swin-L (large), with channel sizes C = 96/96/128/192 and layer counts {2,2,6,2} / {2,2,18,2} / {2,2,18,2} / {2,2,18,2}.</p>",
      "Key Results": "<ul>\n<li><strong>Image classification</strong>: Swin-B achieves 84.5% top-1 on ImageNet-1K (384² input, regular training). With ImageNet-22K pre-training: Swin-L achieves 87.3% top-1, surpassing ViT-L's 85.2% with 2.6× higher throughput.</li>\n</ul>\n<ul>\n<li><strong>Object detection (COCO)</strong>: Swin-L (HTC++) achieves 58.7 box AP and 51.1 mask AP on COCO test-dev, surpassing previous SOTA by +2.7 box AP and +2.6 mask AP. Under standard Cascade Mask R-CNN, Swin-T surpasses ResNet-50 by +3.4~4.2 box AP consistently across four different detection frameworks.</li>\n</ul>\n<ul>\n<li><strong>Semantic segmentation (ADE20K)</strong>: Swin-L (UperNet) achieves 53.5 mIoU, outperforming previous SOTA (SETR) by +3.2 mIoU.</li>\n</ul>\n<ul>\n<li><strong>Linear complexity</strong>: The window-based self-attention has linear computational complexity to image size, making high-resolution dense prediction tractable.</li>\n</ul>",
      "Assumptions": "<ul>\n<li>Hierarchical feature maps (multi-scale) are essential for general-purpose vision backbones.</li>\n<li>Local window self-attention combined with cross-window connections is sufficient for modeling visual relationships.</li>\n<li>The 7×7 window size balances efficiency and modeling power; relative position bias handles positional information effectively.</li>\n<li>The patch merging strategy (2×2 → 4× downsampling per stage) provides a useful inductive bias.</li>\n</ul>",
      "Limitations / Failure Modes": "<ul>\n<li>Window-based self-attention is still limited in capturing extreme long-range dependencies across very distant image regions.</li>\n<li>The cyclic-shift and masking implementation adds engineering complexity compared to standard ViT or CNNs.</li>\n<li>Throughput vs. FLOPs gap: Swin Transformer operations are less hardware-optimized than CuDNN-based ResNets, so theoretical FLOPs advantages may not fully translate to wall-clock speed on all hardware.</li>\n<li>Relative position bias is learned per head, adding parameter count and requiring re-interpolation for different window sizes.</li>\n<li>The fixed window size (M=7) is a hyperparameter that may not be optimal for all tasks or image resolutions.</li>\n</ul>",
      "Reusable Ingredients": "<ul>\n<li>Shifted window attention as a general replacement for global self-attention in vision Transformers.</li>\n<li>Hierarchical patch merging strategy for building multi-scale Transformer feature maps.</li>\n<li>Cyclic-shift efficient batch computation for shifted window partitioning.</li>\n<li>Relative position bias paradigm for window-based attention.</li>\n<li>Architectural design validated as a general-purpose backbone for classification, detection, and segmentation.</li>\n<li>The approach also benefits all-MLP architectures (e.g., MLP-Mixer).</li>\n</ul>",
      "Open Questions": "<ul>\n<li>Can shifted window attention be made adaptive to input content rather than using a fixed grid?</li>\n<li>How does Swin Transformer compare to later advances like ConvNeXt that re-explore CNN designs?</li>\n<li>Can the window-based attention be further optimized for hardware to close the FLOPs/latency gap?</li>\n<li>Is there an optimal hierarchical structure beyond 4-stage / 2× downsample?</li>\n</ul>",
      "Relevance to This Project": "<p>Swin Transformer is a critical evolution of vision Transformers that made them practical for dense prediction tasks. Many modern VLMs use Swin Transformer as a backbone when multi-scale visual features are needed (e.g., for detecting objects at different scales in image-text tasks). It bridges the gap between Transformer architectures and the hierarchical feature pyramid paradigm of CNNs.</p>"

    "thesis": "Pre-training an image encoder and text encoder jointly with a contrastive objective on 400 million (image, text) pairs yields transferable visual representations that enable zero-shot classification on diverse downstream tasks without task-specific training.",
    "sections": {
      "One-line thesis": "<p>Pre-training an image encoder and text encoder jointly with a contrastive objective on 400 million (image, text) pairs yields transferable visual representations that enable zero-shot classification on diverse downstream tasks without task-specific training.</p>",
      "Problem / Gap": "<p>Computer vision systems were traditionally trained to predict fixed predetermined object categories, limiting their generality. Learning from raw text about images was a promising direction but had demonstrated much lower performance than supervised approaches. Prior attempts at natural language supervision for vision either used small datasets (MS-COCO, Visual Genome, YFCC100M) or complex generative objectives; scaling to web-scale data was underexplored.</p>",
      "Method": "<p>CLIP (Contrastive Language-Image Pre-training) trains an image encoder and a text encoder jointly to predict correct pairings in a batch of (image, text) examples. The contrastive objective maximizes cosine similarity between matched image-text pairs while minimizing it for mismatched pairs. Both encoders can be various architectures (ViT or ResNet for images; Transformer for text). After pre-training, natural language is used to reference visual concepts, enabling zero-shot transfer — the text encoder synthesizes a classifier by embedding class names/descriptions, and prediction is done by selecting the highest similarity score. Training uses a dataset of 400M (image, text) pairs called WIT (WebImageText).</p>",
      "Key Results": "<ul>\n<li>Zero-shot CLIP matches ResNet-50 accuracy on ImageNet without using any of its 1.28M training examples</li>\n<li>Competitive with fully supervised baselines on over 30 datasets spanning OCR, action recognition, geo-localization, fine-grained classification</li>\n<li>Zero-shot CLIP is much more robust than equivalent-accuracy supervised ImageNet models</li>\n<li>Transfer performance is a smoothly predictable function of compute</li>\n<li>Linear-probe CLIP outperforms the best publicly available ImageNet model while being more computationally efficient</li>\n</ul>",
      "Assumptions": "<ul>\n<li>Contrastive learning is sufficient for vision-language alignment (more efficient than generative/predictive approaches — 4x more efficient than bag-of-words prediction, 12x more than transformer language model)</li>\n<li>Web-scale data (400M image-text pairs) covers a sufficiently broad set of visual concepts</li>\n<li>Natural language is an effective supervision signal for learning visual representations</li>\n</ul>",

function init() {
  var nodeMap = {};
  PAPERS.forEach(function(p){nodeMap[p.id]=p});

  // Build connections from edges
  PAPERS.forEach(function(p){p.connections=[];p._ex=[];p._exBy=[]});
  EDGES.forEach(function(e){
    var src=nodeMap[e.from], dst=nodeMap[e.to];
    if(!src||!dst||e.type!=='extends')return;
    src._ex.push({target:dst.short,text:e.evidence});
    dst._exBy.push({target:src.short,text:e.evidence});
  });
  PAPERS.forEach(function(p){
    p._ex.forEach(function(c){p.connections.push({type:'extends',target:c.target,text:c.text})});
    p._exBy.forEach(function(c){p.connections.push({type:'extended_by',target:c.target,text:c.text})});
    delete p._ex;delete p._exBy;
  });

  // Stats bar
  var subtitle=document.getElementById('headerSubtitle');
  subtitle.textContent='Vision-Language Model 知识图谱 · '+PAPERS.length+' 篇论文 · '+EDGES.length+' 条关系';
  var years=PAPERS.map(function(p){return p.year}).filter(Boolean);
  var yr=years.length?Math.min.apply(null,years)+'–'+Math.max.apply(null,years):'—';
  var dots=PAPERS.slice(0,6).map(function(p){return'<div class="stat"><span class="dot" style="background:'+p.nodeColor+'"></span><span class="label">'+p.short+'</span></div>'}).join('');
  document.getElementById('statsBar').innerHTML='<div class="stat"><span class="num">'+PAPERS.length+'</span><span class="label">Papers</span></div><div class="stat"><span class="num">'+EDGES.length+'</span><span class="label">Relationships</span></div><div class="stat"><span class="num">'+yr+'</span><span class="label">Timeline</span></div>'+dots;

  // Side panel
  var side=document.getElementById('sidePanel');side.innerHTML='';
  PAPERS.forEach(function(p){
    var c=document.createElement('div');c.className='node-card';
    var a=p.authors.length?p.authors[0]+' et al.':'';
    var m=[a,p.venue,p.year].filter(Boolean).join(' · ')+((p.arxiv)?' · arXiv:'+p.arxiv:'');
    var tg=p.tags.map(function(t){return'<span class="tag" style="background:'+p.nodeColor+'18;color:'+p.nodeColor+';border-color:'+p.nodeColor+'33">'+t+'</span>'}).join('');
    var cn=p.connections.map(function(c){return'<div class="'+(c.type==='extends'?'ext':'extby')+'">'+(c.type==='extends'?'→ Extends':'← Extended by')+': '+c.target+'</div>'}).join('');
    c.innerHTML='<h3>'+p.short+': '+p.title.replace(/:/g,':<wbr>')+'</h3><div class="meta">'+m+'</div><div class="thesis">'+p.thesis+'</div><div class="tags">'+tg+'</div><div class="conn">'+cn+'</div>';
    c.addEventListener('click',function(){openDetail(p.id)});
    side.appendChild(c);
  });

  // Search
  var si=document.getElementById('searchInput');
  si.addEventListener('input',function(){searchPapers(this.value)});
  searchPapers(si.value);

  // D3 force graph
  var el=document.getElementById('graph');
  var w=el.clientWidth,h=Math.max(500,window.innerHeight-200);
  var svg=d3.select('#graph').append('svg').attr('width',w).attr('height',h);
  var g=svg.append('g');
  d3.zoom().scaleExtent([0.3,3]).on('zoom',function(e){g.attr('transform',e.transform)})(svg);

  var nd=PAPERS.map(function(p){return Object.assign({},p)});
  var ld=EDGES.map(function(e){return{source:nd.findIndex(function(n){return n.id===e.from}),target:nd.findIndex(function(n){return n.id===e.to}),evidence:e.evidence}}).filter(function(d){return d.source>=0&&d.target>=0});

  var sim=d3.forceSimulation(nd).force('link',d3.forceLink(ld).distance(200).strength(0.5)).force('charge',d3.forceManyBody().strength(-600)).force('center',d3.forceCenter(w/2,h/2)).force('collision',d3.forceCollide().radius(100));

  var defs=svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',48).attr('refY',0).attr('markerWidth',8).attr('markerHeight',8).attr('orient','auto').append('path').attr('d','M0,-4L10,0L0,4').attr('fill','#58a6ff').attr('opacity',0.6);

  var link=g.append('g').selectAll('line').data(ld).join('line').attr('stroke','#58a6ff').attr('stroke-width',2.5).attr('stroke-dasharray','6,3').attr('marker-end','url(#arrow)');
  g.append('g').selectAll('text').data(ld).join('text').attr('font-size',10).attr('fill','#8b949e').attr('text-anchor','middle').attr('dy',-6).text('extends');

  var node=g.append('g').selectAll('g').data(nd).join('g').call(d3.drag().on('start',function(e,d){if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',function(e,d){d.fx=e.x;d.fy=e.y}).on('end',function(e,d){if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
  node.append('circle').attr('r',42).attr('fill',function(d){return d.nodeColor}).attr('opacity',0.85).on('mouseover',function(e,d){showTooltip(e,d)}).on('mouseout',function(){hideTooltip()}).on('click',function(e,d){e.stopPropagation();openDetail(d.id)});
  window._nodeSel=node;

    link.attr('x1',function(d){return d.source.x}).attr('y1',function(d){return d.source.y}).attr('x2',function(d){return d.target.x}).attr('y2',function(d){return d.target.y});
    
    node.attr('transform',function(d){return 'translate('+d.x+','+d.y+')'});
  });
  window.addEventListener('resize',function(){var cw=el.clientWidth,ch=Math.max(500,window.innerHeight-200);svg.attr('width',cw).attr('height',ch);sim.force('center',d3.forceCenter(cw/2,ch/2)).alpha(0.3).restart()});
}

function searchPapers(query){
  var q=query.toLowerCase().trim();
  var cards=document.getElementById('sidePanel').children;
  var count=PAPERS.length;
  var matches={};
  if(q){
    count=0;
    PAPERS.forEach(function(p,i){
      var haystack=[p.title,p.short,p.authors.join(' '),p.tags.join(' '),p.thesis,p.venue,String(p.year||''),p.slug];
      var match=haystack.join(' ').toLowerCase().indexOf(q)!==-1;
      matches[p.id]=match;
      if(match)count++;
      if(cards[i])cards[i].style.display=match?'':'none';
    });
  }else{PAPERS.forEach(function(p,i){matches[p.id]=true;if(cards[i])cards[i].style.display=''})}
  document.getElementById('searchCount').textContent=q?(count+'/'+PAPERS.length+' results'):'';
  if(window._nodeSel){
    window._nodeSel.select('circle').attr('opacity',function(d){return matches[d.id]?0.85:0.15});
    window._nodeSel.selectAll('text').attr('opacity',function(d){return matches[d.id]?1:0.15});
  }
}
function showTooltip(e,d){
  var tip=document.getElementById('tooltip');
  var ex=d.connections.filter(function(c){return c.type==='extends'}).map(function(c){return c.target}).join(', ');
  var exBy=d.connections.filter(function(c){return c.type==='extended_by'}).map(function(c){return c.target}).join(', ');
  var a=d.authors.length?d.authors[0]+' et al.':'';
  var ar=d.arxiv?' · arXiv:'+d.arxiv:'';
  tip.innerHTML='<strong>'+d.short+': '+d.title+'</strong><br>'+a+' · '+d.venue+' '+d.year+ar+'<br><br>'+d.thesis+'<br><br>'+(ex?'→ Extends: '+ex+'<br>':'')+(exBy?'← Extended by: '+exBy:'');
  var r=document.getElementById('graph').getBoundingClientRect();
  tip.style.left=(e.pageX-r.left+12)+'px';tip.style.top=(e.pageY-r.top-10)+'px';
  tip.classList.add('visible');
}
function hideTooltip(){document.getElementById('tooltip').classList.remove('visible')}

function openDetail(id){
  var p=PAPERS.find(function(x){return x.id===id});if(!p)return;
  var body=document.getElementById('detailBody');
  var a=p.authors.join(', ');
  var ar=p.arxiv?'· <a href="https://arxiv.org/abs/'+p.arxiv+'" target="_blank" style="color:#58a6ff">arXiv:'+p.arxiv+'</a>':'';
  var cn='';
  p.connections.forEach(function(c){cn+='<div>'+(c.type==='extends'?'Extends':'Extended by')+': <strong>'+c.target+'</strong> — '+c.text+'</div>'});
  var sh='',exKeys=['One-line thesis','Connections','Claims','Relevance to This Project'];
  Object.keys(p.sections||{}).forEach(function(k){
    if(exKeys.indexOf(k)!==-1)return;var v=p.sections[k];if(!v||!v.trim())return;
    sh+='<section><h3>'+k+'</h3>'+v+'</section>'
  });
  body.innerHTML='<h2>'+p.short+': '+p.title+'</h2><div class="meta-line">'+a+' · '+p.venue+' '+p.year+' '+ar+'</div><section><h3>One-line Thesis</h3><p>'+p.thesis+'</p></section>'+sh+'<section><h3>Knowledge Graph Connections</h3><div class="conn-detail">'+(cn||'(none)')+'</div></section>';
  document.getElementById('detailModal').classList.add('open');
  (function r(n){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([document.getElementById('detailBody')]).catch(console.error)}else if(n>0){setTimeout(function(){r(n-1)},200)}})(10);
}
function closeDetail(){document.getElementById('detailModal').classList.remove('open')}
document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeDetail()});
